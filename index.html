<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token</title>
<meta name="author" content="ForJiang">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #07090a; color: #e7ece9;
    font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    font-size: 14px; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 20px;
  }
  .form-label { display: block; margin-bottom: 6px; }
  #tokviz textarea.form-control, #tokviz select.form-select {
    font: inherit; color: #e7ece9; background: rgba(16, 22, 19, 0.82);
    border: 1px solid #26302a; border-radius: 8px; padding: 7px 10px;
  }
  #tokviz select.form-select { height: 32px; padding: 0 10px; }
  #tokviz textarea.form-control { width: 100%; resize: vertical; }
  #tokviz textarea.form-control:focus, #tokviz select.form-select:focus { outline: 1px solid #3d4a42; }
  #tokviz .btn {
    font: inherit; color: #dfe7e2; background: rgba(16, 22, 19, 0.82);
    border: 1px solid #26302a; border-radius: 8px;
    height: 32px; padding: 0 12px; cursor: pointer;
    display: inline-flex; align-items: center;
  }
  #tokviz .btn:hover { border-color: #3a463f; }
  #tokviz .btn-sm { padding: 0 10px; }
  .viz-controls, .viz-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .viz-badge { border-radius: 99px; padding: 2px 10px; background: rgba(20, 27, 23, 0.85); color: #9fb0a7; font-size: 12px; }
  .text-muted { color: #93a19a; }
  .text-small { font-size: 12px; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  #tokviz [data-lucide] { display: inline-block; width: 16px; height: 16px; }
  .tk-foot { margin: 0 auto 18px; color: #5f6b64; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<script>
/* 全页背景模式：字符波浪铺满整个视口 */
window.__TOKEN_FULLPAGE__ = true;
/* 独立运行时的 widget 状态兜底：localStorage 持久化 */
window.zcode = {
  widgetState: null,
  setWidgetState: function (s) {
    this.widgetState = Object.assign({}, this.widgetState, s);
    try { localStorage.setItem('token-widget-state', JSON.stringify(this.widgetState)); } catch (e) {}
    return Promise.resolve();
  }
};
try { window.zcode.widgetState = JSON.parse(localStorage.getItem('token-widget-state') || 'null'); } catch (e) {}
</script>

<div id="tokviz">
  <style>
    #tokviz {
      position: relative; overflow: hidden;
      background: #07090a; color: #e7ece9;
      border-radius: 14px; padding: 16px;
    }
    #tokviz .tk-glyph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #tokviz .tk-content { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; }
    #tokviz .tk-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    #tokviz .tk-brand { display: flex; align-items: center; gap: 8px; }
    #tokviz .tk-enc { display: flex; align-items: center; gap: 8px; }
    #tokviz .tk-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    #tokviz .tk-lang {
      display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    #tokviz .tk-lang button {
      border: none; background: transparent; color: #93a19a; font: inherit;
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      cursor: pointer; white-space: nowrap; transition: color .15s, background-color .15s;
    }
    #tokviz .tk-lang button:hover { color: #e7ece9; background: rgba(255, 255, 255, 0.08); }
    #tokviz .tk-lang button.tk-on { background: #e7ece9; color: #0a0c0b; cursor: default; }
    #tokviz .tk-enc .form-label { margin: 0; color: #93a19a; }
    #tokviz .tk-enc .form-select { height: 32px; padding: 0 10px; }
    #tokviz .tk-presets .btn { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; }
    #tokviz .tk-head h3 { margin: 0; color: #f2f7f4; }
    #tokviz .form-label { color: #e7ece9; }
    #tokviz .text-muted { color: #93a19a; }
    #tokviz .tok-chips { display: flex; flex-wrap: wrap; gap: 2px; align-items: flex-start; min-height: 30px; }
    #tokviz .tok-chip {
      position: relative;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      padding: 1px 5px; border-radius: 6px; white-space: pre; word-break: break-all;
      border: 1px solid transparent;
    }
    #tokviz .tok-chip:hover { border-color: rgba(233, 255, 240, 0.38); }
    #tokviz .tk-word  { background: rgba(96, 150, 224, 0.26); --blk: rgba(96, 150, 224, 0.62); }
    #tokviz .tk-cjk   { background: rgba(177, 122, 216, 0.30); --blk: rgba(177, 122, 216, 0.66); }
    #tokviz .tk-num   { background: rgba(110, 205, 160, 0.26); --blk: rgba(110, 205, 160, 0.62); }
    #tokviz .tk-punct { background: rgba(224, 150, 70, 0.24); --blk: rgba(224, 150, 70, 0.58); }
    #tokviz .tk-ws    { background: rgba(233, 255, 240, 0.10); color: #97a69e; --blk: rgba(233, 255, 240, 0.20); }
    #tokviz .tk-byte  { background: rgba(224, 102, 96, 0.30); color: #f6dedb; --blk: rgba(224, 102, 96, 0.62); }
    #tokviz .tk-block {
      position: absolute; inset: 0; z-index: 2; border-radius: inherit;
      pointer-events: none; background: var(--blk, rgba(233, 255, 240, 0.22));
    }
    #tokviz .tok-chip.tk-anim .tk-block {
      animation: tk-sweep 0.16s cubic-bezier(0.87, 0, 0.13, 1) var(--d, 0ms) both;
    }
    #tokviz .tok-chip.tk-anim .tk-txt {
      opacity: 0;
      animation: tk-show 1ms linear calc(var(--d, 0ms) + 0.07s) forwards;
    }
    @keyframes tk-sweep {
      0%    { transform: scaleX(0); transform-origin: left center; }
      49.9% { transform: scaleX(1); transform-origin: left center; }
      50%   { transform: scaleX(1); transform-origin: right center; }
      100%  { transform: scaleX(0); transform-origin: right center; }
    }
    @keyframes tk-show { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #tokviz .tok-chip .tk-block { display: none; }
      #tokviz .tok-chip .tk-txt { opacity: 1 !important; animation: none !important; }
    }
    #tokviz .tok-stat b { font-weight: 500; color: #f2f7f4; }
    #tokviz .st-unit { color: #93a19a; font-style: normal; margin-left: 4px; }
    #tokviz .tk-legend > span { color: #93a19a; }
    #tokviz .tok-empty { color: #93a19a; }
    #tokviz .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  </style>

  <div class="tk-content">
    <div class="tk-head">
      <span class="tk-brand">
        <h3>Token</h3>
      </span>
      <span class="tk-tools">
        <nav class="tk-lang" aria-label="Language">
          <button type="button" data-lang="zh-CN" class="tk-on" aria-current="true">简体中文</button>
          <button type="button" data-lang="zh-TW">繁體中文</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="ja">日本語</button>
        </nav>
        <span class="tk-enc">
          <label class="form-label" for="tk-enc" data-i18n="vocab">词表</label>
          <select id="tk-enc" class="form-select" style="width:auto">
          <optgroup id="og-real" label="GPT 系列真实词表">
            <option value="o200k">o200k_base · GPT-4o</option>
            <option value="o200k_harmony">o200k_harmony · GPT-5 / gpt-oss</option>
            <option value="cl100k">cl100k_base · GPT-4 / 3.5</option>
            <option value="p50k">p50k_base · GPT-3.5 / Codex</option>
            <option value="r50k">r50k_base · GPT-2 / GPT-3</option>
          </optgroup>
          <optgroup id="og-local" label="本地基线（无需联网）">
            <option value="char">字符级 · 每字符 1 Token</option>
            <option value="utf8">UTF-8 字节 · 每字节 1 Token</option>
          </optgroup>
        </select>
        </span>
      </span>
    </div>

    <div class="viz-controls tk-presets">
      <span class="text-muted" data-i18n="examples">示例</span>
      <button type="button" class="btn btn-sm" data-preset="en" data-tooltip="K&R 经典写法" data-i18n="preset_en" data-i18n-tip="tip_en">英文</button>
      <button type="button" class="btn btn-sm" data-preset="langs" data-tooltip="五种语言说 Hello World" data-i18n="preset_langs" data-i18n-tip="tip_langs">多语言</button>
      <button type="button" class="btn btn-sm" data-preset="code" data-tooltip="Python 类 + f-string + 主入口" data-i18n="preset_code" data-i18n-tip="tip_code">代码</button>
      <button type="button" class="btn btn-sm" data-preset="emoji" data-tooltip="Emoji 混排" data-i18n="preset_emoji" data-i18n-tip="tip_emoji">Emoji</button>
      <button type="button" class="btn btn-sm" data-preset="b64" data-tooltip="Base64 编码的 Hello World!" data-i18n="preset_b64" data-i18n-tip="tip_b64">Base64</button>
    </div>

    <div>
      <label class="form-label" for="tk-input" data-i18n="input_label">输入一句话（支持中英文、emoji、代码）</label>
      <textarea id="tk-input" class="form-control" rows="3" spellcheck="false" data-i18n-ph="placeholder"
        placeholder="在这里输入或粘贴文本…"></textarea>
    </div>

    <div class="viz-row tok-stat" aria-live="polite">
      <span><b class="tabular-nums" id="st-tokens">0</b><span class="st-unit" data-i18n="unit_tokens">Tokens</span></span>
      <span><b class="tabular-nums" id="st-chars">0</b><span class="st-unit" data-i18n="unit_chars">字符</span></span>
      <span><b class="tabular-nums" id="st-bytes">0</b><span class="st-unit" data-i18n="unit_bytes">字节</span></span>
      <span><b class="tabular-nums" id="st-ratio">–</b><span class="st-unit" data-i18n="unit_ratio">字符/Token</span></span>
      <span class="viz-badge" id="st-mode">加载词表…</span>
    </div>

    <div id="tk-chips" class="tok-chips" role="list" aria-label="Token 划分结果"></div>

    <div class="viz-row text-small tk-legend" style="gap:14px">
      <span><span class="sw tk-word"></span><span data-i18n="legend_word">单词 / 字母</span></span>
      <span><span class="sw tk-cjk"></span><span data-i18n="legend_cjk">汉字 / 日韩文</span></span>
      <span><span class="sw tk-num"></span><span data-i18n="legend_num">数字</span></span>
      <span><span class="sw tk-punct"></span><span data-i18n="legend_punct">标点 / 符号</span></span>
      <span><span class="sw tk-ws"></span><span data-i18n="legend_ws">空白</span></span>
      <span><span class="sw tk-byte"></span><span data-i18n="legend_byte">字节（不完整 UTF-8）</span></span>
    </div>
  </div>

  <script>
    (function () {
      var host = document.getElementById('tokviz');
      if (host.dataset.glyphInit) return;
      host.dataset.glyphInit = '1';

      /* ================= 背景：字符波浪（Glyph Swell 风格） ================= */
      /* 独立站点设置 window.__TOKEN_FULLPAGE__ = true：画布铺满整个视口，指针全页生效 */
      var FULLPAGE = window.__TOKEN_FULLPAGE__ === true;
      var GLYPH_BG = '#07090a', GLYPH_INK = '#d97757';
      var RAMP = '·:-+=*#', CELL = 15;
      var canvas = document.createElement('canvas');
      canvas.className = 'tk-glyph';
      canvas.setAttribute('aria-hidden', 'true');
      canvas.style.cssText = FULLPAGE
        ? 'position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;'
        : 'position:absolute;inset:0;width:100%;height:100%;display:block;';
      (FULLPAGE ? document.body : host).insertBefore(canvas, host);
      var ctx = canvas.getContext('2d');

      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var coarse = !matchMedia('(hover: hover) and (pointer: fine)').matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var size = coarse ? Math.round(CELL * 0.85) : CELL;
      var L = RAMP.length;

      /* 字形图集：墨水色一排、浪峰色一排 */
      var atlas = document.createElement('canvas');
      var S = Math.ceil(size * dpr);
      atlas.width = S * L; atlas.height = S;
      var a = atlas.getContext('2d');
      function paintAtlas() {
        a.clearRect(0, 0, atlas.width, atlas.height);
        a.textAlign = 'center'; a.textBaseline = 'middle';
        a.font = '500 ' + Math.round(size * 0.82 * dpr) + 'px ui-monospace, Menlo, monospace';
        a.fillStyle = GLYPH_INK;
        for (var i = 0; i < L; i++) a.fillText(RAMP[i], i * S + S / 2, S / 2 + dpr * 0.5);
      }
      paintAtlas();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { paintAtlas(); });

      var W = 0, H = 0, cols = 0, rows = 0;
      var raf = 0, visible = false, last = 0, alive = true, greeted = false;
      var swells = [];
      var t0 = performance.now();
      function now() { return (performance.now() - t0) / 1000; }

      function resize() {
        var w = FULLPAGE ? window.innerWidth : host.clientWidth;
        var h = FULLPAGE ? window.innerHeight : host.clientHeight;
        if (w === W && h === H) return;
        W = w; H = h;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        cols = Math.ceil(W / size) + 1;
        rows = Math.ceil(H / size) + 1;
      }

      function draw(tDraw) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!swells.length) return;
        var ox = ((W - (cols - 1) * size) / 2) * dpr;
        var oy = ((H - (rows - 1) * size) / 2) * dpr;
        for (var j = 0; j < rows; j++) {
          for (var i = 0; i < cols; i++) {
            var v = 0;
            for (var k = 0; k < swells.length; k++) {
              var s = swells[k];
              var age = tDraw - s.t;
              var d = Math.hypot(i - s.x, j - s.y);
              var front = age * 17;
              var band = Math.exp(-((d - front) * (d - front)) / 8);
              if (band < 0.01) continue;
              v += (s.a * band * Math.exp(-age * 1.4)) / (1 + d * 0.015);
            }
            if (v < 0.035) continue;
            var lv = Math.min(L - 1, Math.floor(v * L * 1.05));
            ctx.globalAlpha = Math.min(0.65, 0.12 + v * 0.55);
            ctx.drawImage(atlas, lv * S, 0, S, S,
              ox + i * size * dpr - S / 2, oy + j * size * dpr - S / 2, S, S);
          }
        }
        ctx.globalAlpha = 1;
      }

      function loop(ms) {
        if (!alive || !visible || document.hidden) { raf = 0; return; }
        raf = requestAnimationFrame(loop);
        if (ms - last < (coarse ? 33 : 24)) return;
        last = ms;
        resize();
        while (swells.length && now() - swells[0].t > 2.5) swells.shift();
        draw(now());
        if (!swells.length) { cancelAnimationFrame(raf); raf = 0; }
      }
      function wake() {
        if (!reduced && alive && !raf && visible && !document.hidden)
          raf = requestAnimationFrame(loop);
      }
      function spawn(x, y, amp) {
        if (reduced) return;
        swells.push({ x: x, y: y, t: now(), a: amp });
        if (swells.length > 16) swells.shift();
        wake();
      }

      var lastSpawn = 0;
      var bgTarget = FULLPAGE ? window : host;
      function spawnAt(clientX, clientY, amp) {
        var r = FULLPAGE ? { left: 0, top: 0 } : host.getBoundingClientRect();
        spawn((clientX - r.left) / size, (clientY - r.top) / size, amp);
      }
      bgTarget.addEventListener('pointermove', function (e) {
        var tN = now();
        if (tN - lastSpawn < 0.12) return;
        lastSpawn = tN;
        spawnAt(e.clientX, e.clientY, 0.9);
      });
      bgTarget.addEventListener('pointerdown', function (e) {
        spawnAt(e.clientX, e.clientY, 1.1);
      });

      function greet() {
        if (greeted) return;
        greeted = true;
        resize();
        if (reduced) {
          /* 静态一帧：中心一圈字形纹理 */
          swells.push({ x: cols / 2, y: rows / 2, t: -99, a: 0.85 });
          swells[0].t = now() - 0.55;
          draw(now());
          swells.length = 0;
        } else {
          spawn(cols / 2, rows / 2, 0.85);
        }
      }

      var io = new IntersectionObserver(function (entries) {
        visible = entries[0].isIntersecting;
        if (visible) greet();
        wake();
      });
      io.observe(FULLPAGE ? document.documentElement : host);
      var onResize = function () {
        resize();
        if (reduced && greeted) {
          swells.push({ x: cols / 2, y: rows / 2, t: now() - 0.55, a: 0.85 });
          draw(now());
          swells.length = 0;
        }
      };
      if (FULLPAGE) window.addEventListener('resize', onResize);
      else {
        var ro = new ResizeObserver(onResize);
        ro.observe(host);
      }
      document.addEventListener('visibilitychange', wake);

      /* ================= Tokenizer ================= */
      var $ = function (id) { return document.getElementById(id); };
      var input = $('tk-input'), sel = $('tk-enc'), chipsEl = $('tk-chips');
      var stTokens = $('st-tokens'), stChars = $('st-chars'), stBytes = $('st-bytes'),
          stRatio = $('st-ratio'), stMode = $('st-mode');

      var DEFAULT = 'Hello, world!';
      var PRESETS = {
        en: 'Hello, world!',
        langs: 'Hello World! / 你好，世界！ / こんにちは世界！ / Bonjour le monde ! / ¡Hola Mundo!',
        code: 'class Greeter:\n    """Greets the world in style."""\n\n    def __init__(self, name: str = "World") -> None:\n        self.name = name\n\n    def greet(self) -> str:\n        return f"Hello, {self.name}!"\n\n\nif __name__ == "__main__":\n    for lang in ("en", "zh", "ja"):\n        print(Greeter(lang).greet())',
        emoji: '👋 Hello World! 🌍✨',
        b64: 'SGVsbG8gV29ybGQh'
      };

      /* ---------- i18n（语言切换，原地替换） ---------- */
      var lang = 'zh-CN';
      var ALL_LANGS = ['zh-CN', 'zh-TW', 'en', 'ja'];
      var I18N = {
        'zh-CN': {
          vocab: '词表', examples: '示例',
          preset_en: '英文', preset_langs: '多语言', preset_code: '代码', preset_emoji: 'Emoji', preset_b64: 'Base64',
          tip_en: 'K&R 经典写法', tip_langs: '五种语言说 Hello World', tip_code: 'Python 类 + f-string + 主入口',
          tip_emoji: 'Emoji 混排', tip_b64: 'Base64 编码的 Hello World!',
          input_label: '输入一句话（支持中英文、emoji、代码）', placeholder: '在这里输入或粘贴文本…',
          empty: '输入文字后，这里会显示切分结果',
          unit_tokens: 'Tokens', unit_chars: '字符', unit_bytes: '字节', unit_ratio: '字符/Token',
          badge_loading: '加载词表…',
          badge_o200k: 'o200k_base · GPT-4o 词表', badge_o200k_harmony: 'o200k_harmony · GPT-5 / gpt-oss 词表',
          badge_cl100k: 'cl100k_base · GPT-4 / 3.5 词表', badge_p50k: 'p50k_base · GPT-3.5 / Codex 词表',
          badge_r50k: 'r50k_base · GPT-2 / GPT-3 词表', badge_char: '字符级 · 每个字符 1 Token',
          badge_utf8: 'UTF-8 字节级 · 每字节 1 Token', badge_fail: '词表加载失败 · 离线近似切分',
          legend_word: '单词 / 字母', legend_cjk: '汉字 / 日韩文', legend_num: '数字',
          legend_punct: '标点 / 符号', legend_ws: '空白', legend_byte: '字节（不完整 UTF-8）',
          tip_byte_word: '字节', tip_codepoint: '码点', tip_approx: '近似切分',
          overflow: function (shown, total) { return '… 仅显示前 ' + shown + ' 个，共 ' + total + ' 个'; }
        },
        'zh-TW': {
          vocab: '詞表', examples: '範例',
          preset_en: '英文', preset_langs: '多語言', preset_code: '程式碼', preset_emoji: 'Emoji', preset_b64: 'Base64',
          tip_en: 'K&R 經典寫法', tip_langs: '五種語言說 Hello World', tip_code: 'Python 類別 + f-string + 進入點',
          tip_emoji: 'Emoji 混排', tip_b64: 'Base64 編碼的 Hello World!',
          input_label: '輸入一句話（支援中英文、emoji、程式碼）', placeholder: '在這裡輸入或貼上文字…',
          empty: '輸入文字後，這裡會顯示切分結果',
          unit_tokens: 'Tokens', unit_chars: '字元', unit_bytes: '位元組', unit_ratio: '字元/Token',
          badge_loading: '載入詞表…',
